{# Options des projets de tout le groupe, par entité. Variables : contextes, choisi, exclure #}
<option value="">— Nouveau projet —</option>
{% for ent, deps, projs in contextes if projs %}<optgroup label="{{ ent.nom }}">{% for p in projs if p.id != exclure %}<option value="{{ p.id }}" {% if choisi == p.id|string %}selected{% endif %}>{{ p.nom }}</option>{% endfor %}</optgroup>{% endfor %}
